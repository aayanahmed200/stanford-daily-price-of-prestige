name: Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The Scorecard download server rejects GitHub's datacenter IPs (HTTP
      # 403), so the site is built from committed derived artifacts
      # (data/processed, outputs, figures). Rebuild them locally with
      # `make pipeline` and commit the refresh.
      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5

      # The artifact is uploaded in this job and deployed from the next one:
      # deploying in the same job that uploads hits a known race where the
      # deploy step cannot see the artifact yet.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
