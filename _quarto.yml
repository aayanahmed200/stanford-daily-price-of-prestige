project:
  type: website
  title: "The Price of Prestige"
  output-dir: _site

website:
  title: "The Price of Prestige"
  description: "What a Stanford degree is actually worth, from the College Scorecard."
  site-url: "https://aayanahmed200.github.io/stanford-daily-price-of-prestige/"
  repo-url: "https://github.com/aayanahmed200/stanford-daily-price-of-prestige"
  favicon: assets/favicon.svg
  open-graph:
    locale: en_US
    site-name: "The Price of Prestige"
  twitter-card:
    creator: "@stanforddaily"
  navbar:
    left:
      - text: "Article"
        file: index.qmd
      - text: "Notebook"
        file: notebooks/notebook.qmd
      - text: "Methods"
        file: docs/methods.qmd
      - text: "Sources"
        file: docs/sources.qmd
    right:
      - icon: github
        href: https://github.com/aayanahmed200/stanford-daily-price-of-prestige
        aria-label: GitHub repository
  page-footer:
    left: "Data: U.S. Dept. of Education College Scorecard & FRED/BLS CPI. See [Sources](/docs/sources.qmd)."
    right: "Produced for the [Stanford Daily Tech Bootcamp](https://github.com/TheStanfordDaily/tech-practicum)."

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: false
    highlight-style: arrow
    theme:
      light:
        - flatly
        - assets/quarto.scss
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

execute:
  freeze: auto
