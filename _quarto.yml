project:
  type: website
  title: "The Price of Prestige"
  output-dir: _site

website:
  title: "The Price of Prestige"
  description: "What a Stanford degree is actually worth, from the College Scorecard."
  site-url: "https://aayanahmed200.github.io/stanford-daily-price-of-prestige/"
  repo-url: "https://github.com/aayanahmed200/stanford-daily-price-of-prestige"
  favicon: assets/favicon.png
  open-graph:
    locale: en_US
    site-name: "The Price of Prestige"
  twitter-card:
    creator: "@stanforddaily"

format:
  html:
    # The shared series stylesheet does the layout; quarto.scss only bridges
    # Quarto's markup onto it. No navbar, sidebar or TOC, because the other
    # three pages in the series have none.
    toc: false
    # Adds <link rel="canonical"> to every page, built from site-url above,
    # the way the three static sites declare it by hand.
    canonical-url: true
    css: assets/series.css
    code-fold: false
    highlight-style: arrow
    theme:
      light:
        - flatly
        - assets/quarto.scss
    include-before-body:
      - file: assets/masthead.html
    include-after-body:
      - file: assets/series-footer.html
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

execute:
  freeze: auto
